<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <section>
      <h2>Student Regitration Form</h2>
      <form>
        <label for="name"> Student Name:</label>
        <input type="text" id="name" name="name" required /><br /><br />

        <label for="father-name"> Father's Name:</label>
        <input type="text" id="father-name" name="father-name" /><br /><br />

        <label for="name"> Caste:</label>
        <input type="text" id="name" name="name" required />

        <label for="occupation"> Occupation:</label>
        <input type="text" id="occupation" name="occupation" /><br /><br />

        <label for="qualification"> Qualification:</label>
        <input type="text" id="qualification" name="qualification" />

        <label for="income"> Income:</label>
        <input type="number" id="income" name="income" /><br /><br />

        <label for="class"> Class for Admission:</label>
        <input type="number" id="class" name="class" /><br /><br />

        <label for="admission-fee"> Admission fee:</label>
        <input type="number" id="admission-fee" name="admission-fee" />

        <label for="tuition-fee"> Tuition fee:</label>
        <input type="number" id="tuition-fee" name="tuition-fee" /><br /><br />

        <label for="tuition-fee"> Signature of father or guardian:</label>
        <input type="text" id="signature" name="signature" /><br /><br />

        <label for="permanent-address"> Permanent Address:</label>
        <input
          type="text"
          id="permanent-address"
          name="permanent-address"
        /><br /><br />

        <label for="temporary-address"> Temporary Address:</label>
        <input
          type="text"
          id="temporary-address"
          name="temporary-address"
        /><br /><br />

        <input type="submit" value="Submit" />
      </form>
    </section>
  </body>
</html>
