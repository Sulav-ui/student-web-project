  <body>
    <header>
      <h1>Sulav Khatri</h1>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="education.html">Education</a></li>

          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <hr />

    <main>
      <section>
        <h2>Contact Information</h2>

        <p>Email: ksulav10@gmail.com</p>
        <p>Phone: +1 (516) 233-</p>

        <p>
          <a href="https://github.com/Sulav-ui" target="_blank"> GitHub </a>
        </p>

        <p>
          <a
            href="https://www.linkedin.com/in/sulav-khatri-712739398/"
            target="_blank"
          >
            LinkedIn
          </a>
        </p>
      </section>

      <section>
        <h2>Contact Me</h2>

        <form>
          <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" />

            <br /><br />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" />

            <br /><br />

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" />

            <br /><br />

            <label for="country">Country:</label>

            <select id="country" name="country">
              <option value="">Select Country</option>
              <option value="usa">United States</option>
              <option value="nepal">Nepal</option>
              <option value="canada">Canada</option>
              <option value="india">India</option>
            </select>
          </fieldset>

          <br />

          <fieldset>
            <legend>Gender</legend>

            <input type="radio" id="male" name="gender" value="male" />

            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female" />

            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other" />

            <label for="other">Other</label>
          </fieldset>

          <br />

          <fieldset>
            <legend>Skills / Interests</legend>

            <input
              type="checkbox"
              id="coding"
              name="interests"
              value="coding"
            />

            <label for="coding">Coding</label>

            <br />

            <input
              type="checkbox"
              id="cybersecurity"
              name="interests"
              value="cybersecurity"
            />

            <label for="cybersecurity"> Cybersecurity </label>

            <br />

            <input type="checkbox" id="cloud" name="interests" value="cloud" />

            <label for="cloud">Cloud Computing</label>

            <br />

            <input
              type="checkbox"
              id="sports"
              name="interests"
              value="sports"
            />

            <label for="sports">Sports</label>
          </fieldset>

          <br />

          <fieldset>
            <legend>Message</legend>

            <label for="message">Your Message:</label>

            <br />

            <textarea id="message" name="message" rows="6" cols="40"></textarea>
          </fieldset>

          <br />

          <button type="submit">Submit</button>
        </form>
      </section>
    </main>

    <hr />
