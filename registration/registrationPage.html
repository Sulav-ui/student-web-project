<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Page</title>
    <link rel="stylesheet" href="registration.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  </head>
  <body>
    <div class="container">
        <div class="left">
            <div class="left-header">
                <div class="head">
                    <h1>Welcome Page</h1>
                    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Iure aut facere, doloribus delectus impedit dicta odit quibusdam!</p>
                </div>
                <div class="social-icon">
                    <p>----Get Connected With----</p>
                    <a href="#"><i class="fa fa-facebook"></i></a>
                    <a href="#"><i class="fa fa-twitter"></i></a>
                    <a href="#"><i class="fa fa-instagram"></i></a>
                </div>
            </div>
            
        </div>

        <div class="right">
            <div class="header">
                <h3>Register</h3>
            </div>

            <div class="form">
                <form action="register" method="post">
                    <label for="username">FULL NAME</label><br>
                    <input type="text" id="username" name="username" required value="Enter your full name" /><br><br>

                    <label for="email">EMAIL</label><br>
                    <input type="email" id="email" name="email" required  value="Enter your email"/><br><br>

                    <label for="password">PASSWORD</label><br>
                    <input type="password" id="password" name="password" required value="Enter your password" /><br><br>

                    <div class="terms">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the Terms and Conditions</label>
                    </div>

                    <button type="submit">Sign Up</button>
                </form>
            </div>
        </div>
  </body>
</html>
